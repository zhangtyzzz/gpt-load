name: Build Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version embedded in dry-run binaries"
        required: true
        default: "v0.0.0-beta.1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Unsupported release tag: $RELEASE_TAG"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$REF_TYPE" != "tag" || "$REF_NAME" != "$RELEASE_TAG" || "$GITHUB_REF" != "refs/tags/${RELEASE_TAG}" ]]; then
              echo "::error::Release tag does not exactly match the pushed tag ref"
              exit 1
            fi
          elif [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::Unsupported release event: $EVENT_NAME"
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Refuse a published release before building
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          if existing_draft="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.draft' 2>release-query-error.log)"; then
            if [[ "$existing_draft" != "true" ]]; then
              echo "::error::Release ${RELEASE_TAG} is already published; refusing to rebuild or replace it"
              exit 1
            fi
            echo "Release ${RELEASE_TAG} is still a draft and may be refreshed"
          elif grep -q 'HTTP 404' release-query-error.log; then
            echo "No existing release for ${RELEASE_TAG}; a draft may be created"
          else
            cat release-query-error.log >&2
            exit 1
          fi

  frontend:
    name: Build embedded frontend once
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        env:
          VITE_VERSION: ${{ needs.validate.outputs.release_tag }}
        run: |
          npm ci
          npm run build

      - name: Upload embedded frontend
        uses: actions/upload-artifact@v7
        with:
          name: release-web-dist
          path: web/dist
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  linux:
    name: Build Linux binaries
    needs:
      - validate
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download embedded frontend
        uses: actions/download-artifact@v8
        with:
          name: release-web-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
          cache-dependency-path: go.sum

      - name: Build Linux binaries
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p release-assets
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X gpt-load/internal/version.Version=${RELEASE_TAG}" \
            -o release-assets/gpt-load-linux-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags "-s -w -X gpt-load/internal/version.Version=${RELEASE_TAG}" \
            -o release-assets/gpt-load-linux-arm64

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-binaries
          path: release-assets/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  macos:
    name: Build macOS binaries
    needs:
      - validate
      - frontend
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download embedded frontend
        uses: actions/download-artifact@v8
        with:
          name: release-web-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
          cache-dependency-path: go.sum

      - name: Build macOS binaries
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p release-assets
          go mod download
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build \
            -ldflags "-s -w -X gpt-load/internal/version.Version=${RELEASE_TAG}" \
            -o release-assets/gpt-load-macos-amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -ldflags "-s -w -X gpt-load/internal/version.Version=${RELEASE_TAG}" \
            -o release-assets/gpt-load-macos-arm64

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-binaries
          path: release-assets/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  windows:
    name: Build Windows binary
    needs:
      - validate
      - frontend
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download embedded frontend
        uses: actions/download-artifact@v8
        with:
          name: release-web-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
          cache-dependency-path: go.sum

      - name: Build Windows binary
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p release-assets
          go mod download
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -ldflags "-s -w -X gpt-load/internal/version.Version=${RELEASE_TAG}" \
            -o release-assets/gpt-load-windows-amd64.exe

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-binaries
          path: release-assets/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  package_release:
    name: Assemble release bundle
    needs:
      - validate
      - linux
      - macos
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-*-binaries
          path: release-assets
          merge-multiple: true

      - name: Verify assets and generate checksums
        shell: bash
        working-directory: release-assets
        run: |
          set -Eeuo pipefail
          expected=(
            gpt-load-linux-amd64
            gpt-load-linux-arm64
            gpt-load-macos-amd64
            gpt-load-macos-arm64
            gpt-load-windows-amd64.exe
          )
          for asset in "${expected[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Missing release asset: $asset"
              exit 1
            fi
          done
          actual_count="$(find . -maxdepth 1 -type f -name 'gpt-load-*' | wc -l | tr -d ' ')"
          if [[ "$actual_count" != "${#expected[@]}" ]]; then
            echo "::error::Expected ${#expected[@]} binaries, found $actual_count"
            exit 1
          fi
          sha256sum "${expected[@]}" > SHA256SUMS
          if [[ "$(wc -l < SHA256SUMS | tr -d ' ')" != "${#expected[@]}" ]]; then
            echo "::error::SHA256SUMS does not contain exactly ${#expected[@]} entries"
            exit 1
          fi
          sha256sum -c SHA256SUMS

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle-${{ needs.validate.outputs.release_tag }}
          path: release-assets/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release_draft:
    name: Create one draft release
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.ref_name == needs.validate.outputs.release_tag
    needs:
      - validate
      - package_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle-${{ needs.validate.outputs.release_tag }}
          path: release-assets

      - name: Generate deterministic release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --field "tag_name=${RELEASE_TAG}" \
            --field "target_commitish=${GITHUB_SHA}" \
            --jq '.body' > release-notes.md

      - name: Recheck that the release is not published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          if existing_draft="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.draft' 2>release-query-error.log)"; then
            if [[ "$existing_draft" != "true" ]]; then
              echo "::error::Release ${RELEASE_TAG} is already published; refusing to replace its notes or assets"
              exit 1
            fi
          elif grep -q 'HTTP 404' release-query-error.log; then
            echo "No existing release for ${RELEASE_TAG}; a draft may be created"
          else
            cat release-query-error.log >&2
            exit 1
          fi

      - name: Create or update draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          name: ${{ needs.validate.outputs.release_tag }}
          files: |
            release-assets/gpt-load-linux-amd64
            release-assets/gpt-load-linux-arm64
            release-assets/gpt-load-macos-amd64
            release-assets/gpt-load-macos-arm64
            release-assets/gpt-load-windows-amd64.exe
            release-assets/SHA256SUMS
          body_path: release-notes.md
          draft: true
          prerelease: ${{ contains(needs.validate.outputs.release_tag, '-beta.') }}
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
